version: '3.9'

services:
  scanner:
    build: .
    container_name: lan-scanner
    network_mode: host          # 必须使用 host 模式才能扫描局域网
    privileged: false
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./data:/data            # 持久化备注数据库
    restart: unless-stopped
