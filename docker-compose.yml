version: '3.9'
services:
  scanner:
    image: ccion/lan-scanner:latest   # 或 build: .
    container_name: lan-scanner
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - SCAN_PORTS=${SCAN_PORTS}      # 引用环境变量
    volumes:
      - ./data:/data
    restart: unless-stopped
