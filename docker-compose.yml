version: '3.9'
services:
  scanner:
    image: ccion/lan-scanner:latest   # 如果你修复了镜像就用这行，否则用 build: .
    container_name: lan-scanner
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - SCAN_PORTS=${SCAN_PORTS:-21,22,23,80,443,8080}   # 默认常用端口
    volumes:
      - ./data:/data
    restart: unless-stopped
